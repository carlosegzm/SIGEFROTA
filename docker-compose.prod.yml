services:
  postgres:
    image: 'postgres:16-alpine'
    restart: unless-stopped
    environment:
      - POSTGRES_DB=sigefrota
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: 'redis:7-alpine'
    restart: unless-stopped

  rabbitmq:
    image: 'rabbitmq:3-alpine'
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USERNAME}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}

  kafka:
    image: 'apache/kafka:3.8.0'
    restart: unless-stopped
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=INTERNAL://:19092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:19092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_HEAP_OPTS=-Xms256m -Xmx256m

  mailhog:
    image: 'mailhog/mailhog'
    restart: unless-stopped

  frota-core:
    build:
      context: ./frota-core
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/sigefrota
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:19092
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?defina CORS_ALLOWED_ORIGINS no .env}
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx320m
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - kafka

  frota-notification:
    build:
      context: ./frota-notification
    restart: unless-stopped
    environment:
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:19092
      - SPRING_MAIL_HOST=mailhog
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx256m
    depends_on:
      - rabbitmq
      - mailhog

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL:?defina VITE_API_URL no .env}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - frota-core

volumes:
  postgres_data: