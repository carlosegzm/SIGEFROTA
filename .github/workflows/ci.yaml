name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build frota-core
        working-directory: ./frota-core
        run: ./mvnw -B compile

  build-notification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build frota-notification
        working-directory: ./frota-notification
        run: ./mvnw -B compile