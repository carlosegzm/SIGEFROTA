spring:
  main:
    allow-bean-definition-overriding: true

  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: admin
    password: password
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false

  rabbitmq:
    username: testuser
    password: testpass

jwt:
  secret: test-secret-key-must-have-32-chars